<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://web.poecdn.com data:; media-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PoE Helper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="name"><img id="brandIcon" class="brand-icon" alt="" width="30" height="30" src="../../assets/icon-mark.png"><span>PoE Helper</span></div>
      <nav id="nav" aria-label="Pages">
        <button data-page="dashboard" data-icon="eye" data-art="Exalted Orb" class="active">Overview</button>
        <div class="nav-group">Loot</div>
        <button data-page="filters" data-icon="drop" data-art="Chaos Orb">Loot filter</button>
        <button data-page="designer" data-icon="sparkle" data-art="Orb of Alteration">Tier designer</button>
        <div class="nav-group">Wealth</div>
        <button data-page="networth" data-icon="coins" data-art="Divine Orb">WealthyExile</button>
        <button data-page="farm" data-icon="leaf" data-art="Mirror of Kalandra">What to farm</button>
        <div class="nav-group">Tools</div>
        <button data-page="pob" data-icon="book" data-art="Orb of Regret">Path of Building</button>
        <button data-page="regex" data-icon="map" data-art="Cartographer's Chisel">Regex</button>
        <button data-page="lab" data-icon="key" data-art="Offering to the Goddess">Daily lab</button>
        <button data-page="macros" data-icon="chat">Chat macros</button>
        <div class="nav-sep" role="separator"></div>
        <button data-page="settings" data-icon="hammer" data-art="Blacksmith's Whetstone">Settings</button>
      </nav>
      <div class="foot" id="sideFoot"></div>
    </aside>
    <main class="main">
      <section class="page active" id="page-dashboard"></section>
      <section class="page" id="page-networth"></section>
      <section class="page" id="page-farm"></section>
      <section class="page" id="page-lab"></section>
      <section class="page" id="page-macros"></section>
      <section class="page" id="page-regex"></section>
      <section class="page" id="page-pob"></section>
      <section class="page" id="page-filters"></section>
      <section class="page" id="page-designer"></section>
      <section class="page" id="page-settings"></section>
    </main>
  </div>
  <script src="dom.js"></script>
  <script src="tier-names.js"></script>
  <script src="hotkey.js"></script>
  <script src="trade-panel.js"></script>
  <script src="chart.js"></script>
  <script src="farm.js"></script>
  <script src="lab.js"></script>
  <script src="regex.js"></script>
  <script src="filters.js"></script>
  <script src="designer.js"></script>
  <script src="pob.js"></script>
  <script src="app.js"></script>
</body>
</html>
