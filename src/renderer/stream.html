<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PoE Helper stream</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 14px "Segoe UI", system-ui, sans-serif; color: #ece9e2; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 520px; text-align: center; line-height: 1.5; color: #b9bdc7; }
    #msg b { color: #ece9e2; }
    #tip { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: #8e93a0; background: #000a; padding: 4px 8px; border-radius: 6px; transition: opacity .6s; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="msg">Starting…</div>
  <div id="tip">Share this window in Discord. Keep it open (not minimised); it can sit behind the game or on another screen.</div>
  <script src="stream.js"></script>
</body>
</html>
